name: seekhojeeto
description: "Seekho Jeeto - quiz app for Indian students (Science, Maths, Values & Religion) in 13 languages."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/questions.json
